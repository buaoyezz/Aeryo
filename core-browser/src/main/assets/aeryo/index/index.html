<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeryo URLs</title>
    <style>
        body {
            font-family: monospace;
            font-size: 14px;
            color: #222;
            background: #fff;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: #111;
                color: #ddd;
            }
        }
        h1 {
            font-size: 18px;
            margin: 0 0 20px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
        }
        @media (prefers-color-scheme: dark) {
            h1 { border-bottom-color: #444; }
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin-bottom: 10px;
        }
        a {
            text-decoration: none;
            color: #0055cc;
        }
        @media (prefers-color-scheme: dark) {
            a { color: #5c9ce6; }
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Aeryo URLs</h1>
    <p>List of all available internal pages:</p>
    <ul>
        <li><a href="aeryo://version">aeryo://version</a></li>
    </ul>
</body>
</html>
